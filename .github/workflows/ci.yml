name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }}, ${{ matrix.memory }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4']
        memory: ['256M']
        include:
          # The smallest shared-hosting budget.
          - os: ubuntu-latest
            php: '8.3'
            memory: '128M'
          # Windows PHP bundles GD, so image bitmaps count towards memory_limit there
          # (Linux distributions link the system libgd, whose memory PHP does not see).
          - os: windows-latest
            php: '8.3'
            memory: '256M'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, pdo_sqlite, zip, fileinfo, exif, mbstring
          # Shared-hosting budget: the suite must pass at 256M and at 128M.
          ini-values: memory_limit=${{ matrix.memory }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r "echo 'memory_limit=' . ini_get('memory_limit') . PHP_EOL;"

      - name: PHP tests (Pest)
        if: matrix.memory != '128M'
        run: php artisan test

      # One process per test file: a single process running the whole suite keeps every loaded
      # class (Filament, Livewire, ...) and needs ~110 MB before the first image is decoded, which
      # says nothing about a real request. Per file, each feature must fit the 128M budget.
      - name: PHP tests (Pest) at 128M, one process per file
        if: matrix.memory == '128M'
        shell: bash
        run: |
          status=0
          for file in $(find tests/Feature tests/Unit -name '*Test.php' | sort); do
            php -d memory_limit=128M vendor/bin/pest "$file" || status=1
          done
          exit $status

      - name: Prebuilt theme CSS matches the sources
        run: php artisan larawebkit:themes:build --check

      - name: JS scorer parity tests
        if: runner.os == 'Linux'
        run: npm test

      - name: Build front-end assets
        if: runner.os == 'Linux'
        run: |
          npm ci --ignore-scripts
          npm run build

  mariadb:
    # Production runs on MySQL / MariaDB: the SQL dump of the backup module is tested against it.
    name: Backups on MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: larawebkit
          MARIADB_USER: larawebkit
          MARIADB_PASSWORD: larawebkit
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: larawebkit
      DB_USERNAME: larawebkit
      DB_PASSWORD: larawebkit
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, pdo_mysql, zip, fileinfo, exif, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: vendor/bin/pest tests/Feature/Backup

  lighthouse:
    # Every bundled theme's demo (home, a post, the blog) against scripts/lighthouse/budgets.json.
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, pdo_sqlite, zip, fileinfo, exif, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Production-like site
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/; s#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --force
          php artisan storage:link
          php artisan larawebkit:themes:publish
      - name: Serve
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
      - name: Lighthouse
        run: CHROME_PATH=$(which google-chrome || which chromium) node scripts/lighthouse/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: storage/lighthouse
          retention-days: 14

  style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
